<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUMI · Dantex Toons</title>

  <style>
    :root{
      color-scheme:light;
      --ink:#293d36;
      --green:#356049;
      --cream:#fff9ef;
      --line:#dfe7da;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--cream);
      color:var(--ink);
      font:17px/1.7 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    .wrap{
      max-width:800px;
      margin:auto;
      padding:40px 24px;
    }

    header{
      padding:40px 0 28px;
      border-bottom:1px solid var(--line);
      background:#eef4e8;
    }

    .brand{
      font-size:38px;
      font-weight:850;
      letter-spacing:.06em;
    }

    .byline{
      color:#596c5a;
      font-size:15px;
    }

    .card{
      margin-top:30px;
      padding:28px;
      border:1px solid var(--line);
      border-radius:22px;
      background:white;
    }

    h1{
      margin-top:0;
      font-size:34px;
    }

    a{
      display:block;
      margin:14px 0;
      padding:12px 16px;
      border:1px solid var(--line);
      border-radius:14px;
      text-decoration:none;
      color:var(--green);
      font-weight:650;
      background:white;
    }

    a:hover{
      background:#eef4e8;
    }

    footer{
      margin-top:35px;
      color:#596c5a;
      font-size:14px;
    }
  </style>
</head>

<body>

<header>
  <div class="wrap">
    <div class="brand">LUMI</div>
    <div class="byline">Dantex Toons · Lernen und Spielen auf dem iPad</div>
  </div>
</header>

<main class="wrap">

  <div class="card">
    <h1>LUMI</h1>

    <p>
      Informationen, Datenschutz und Support zur Kinder-Lern-App LUMI.
    </p>

    <a href="datenschutz.html">
      Datenschutz / Privacy Policy
    </a>

    <a href="support.html">
      Hilfe &amp; Support / Help &amp; Support
    </a>

    <a href="impressum.html">
      Impressum / Provider Information
    </a>

  </div>

  <footer>
    Dantex Toons · LUMI
  </footer>

</main>

</body>
</html>
